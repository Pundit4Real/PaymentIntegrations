{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
        <div class="card page-card overflow-hidden">
            <div class="card-body p-5">
                <div class="mb-4 text-center">
                    <span class="badge bg-primary rounded-pill mb-2">Start Payment</span>
                    <h2 class="h4 fw-semibold">Enter payment details</h2>
                    <p class="text-muted mb-0">Add the amount you want to pay and continue to checkout with Paystack.</p>
                </div>

                <form action="." method="post" class="row g-4">
                    {% csrf_token %}
                    <div class="col-12">
                        {{ payment_form | crispy }}
                    </div>
                    <div class="col-12 text-end">
                        <button type="submit" class="btn btn-primary btn-lg">Proceed to Payment</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
